version: '3.8'

services:
  vpn_bot:
    build: .
    container_name: vpn_bot
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config/panels.yaml:/app/config/panels.yaml:ro
    networks:
      - vpn_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: vpn_bot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - vpn_bot
    networks:
      - vpn_network

networks:
  vpn_network:
    driver: bridge
